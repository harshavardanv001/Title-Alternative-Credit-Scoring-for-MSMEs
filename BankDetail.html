<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Account Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --blue-900: #1e3a8a;
            --blue-600: #2563eb;
            --blue-500: #3b82f6;
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-100: #f9fafb;
            --gray-200: #e5e7eb;
            --success-600: #059669;
            --glass-white: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(0, 0, 0, 0.06);
            --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--gray-100) 0%, #e0e7ff 50%, #dbeafe 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--gray-800);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Enhanced Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
            animation: subtleFloat 30s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            33% { transform: translateY(-8px) scale(1.01); }
            66% { transform: translateY(-4px) scale(1.015); }
        }

        /* Floating Geometric Details */
        .floating-geo {
            position: fixed;
            background: rgba(59, 130, 246, 0.06);
            border: 1px solid rgba(59, 130, 246, 0.12);
            border-radius: 8px;
            pointer-events: none;
            z-index: -1;
            animation: geoFloat 20s linear infinite;
        }

        .geo-1 {
            width: 40px; height: 40px;
            top: 15%; left: 10%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation-delay: 0s;
        }

        .geo-2 {
            width: 30px; height: 30px;
            bottom: 25%; right: 12%;
            clip-path: circle(50%);
            animation-delay: 8s;
        }

        @keyframes geoFloat {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
            50% { transform: translate(20px, -15px) rotate(180deg); opacity: 0.3; }
            100% { transform: translate(0, 0) rotate(360deg); opacity: 0.6; }
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Elegant Progress Line */
        .progress-line {
            width: 200px;
            height: 4px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 2px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue-500), var(--blue-600));
            border-radius: 2px;
            width: 66.66%;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
            transition: width 0.4s ease;
        }

        /* Main Form Container */
        .form-container {
            background: var(--glass-white);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            max-width: 520px;
            width: 100%;
            position: relative;
        }

        /* Enhanced Gradient Header Bar */
        .form-header-bar {
            height: 6px;
            background: linear-gradient(90deg, var(--blue-900), var(--blue-600), var(--blue-500));
            position: relative;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
        }

        .form-header-bar::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 12px solid var(--blue-500);
            filter: drop-shadow(0 2px 4px rgba(59, 130, 246, 0.2));
        }

        /* Form Content */
        .form-content {
            padding: 48px 40px 40px;
        }

        /* Typography */
        .form-title {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            color: var(--gray-900);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            position: relative;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--blue-500), transparent);
            border-radius: 2px;
        }

        .form-subtitle {
            font-size: 1rem;
            color: var(--gray-700);
            text-align: center;
            margin-bottom: 36px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* Field Groups */
        .field-group {
            margin-bottom: 24px;
            position: relative;
        }

        .field-group.full-width {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 8px;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .field-input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--gray-900);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-xs);
            position: relative;
        }

        .field-input:focus {
            outline: none;
            border-color: var(--blue-500);
            box-shadow: 
                0 0 0 3px rgba(59, 130, 246, 0.08),
                0 4px 12px rgba(59, 130, 246, 0.15),
                var(--shadow-sm);
            transform: translateY(-1px);
        }

        .field-input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        .field-input#ifsc {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-variant-caps: all-small-caps;
        }

        /* Account Confirmation Grid */
        .account-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Enhanced Primary Button */
        .primary-button {
            width: 100%;
            background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
            color: white;
            border: none;
            padding: 20px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 14px rgba(37, 99, 235, 0.4),
                0 2px 6px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .primary-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255,255,255,0.25), 
                transparent);
            transition: left 0.6s ease;
        }

        .primary-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 25px rgba(37, 99, 235, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, var(--blue-500), #2563eb);
        }

        .primary-button:hover::before {
            left: 100%;
        }

        .primary-button:active {
            transform: translateY(0);
        }

        /* Footer */
        .form-footer {
            text-align: center;
            padding: 24px 40px 0;
            border-top: 1px solid var(--gray-200);
            margin-top: 32px;
        }

        .security-note {
            font-size: 0.8rem;
            color: var(--gray-600);
            font-weight: 500;
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container {
            animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .page-wrapper {
                padding: 24px 16px;
            }
            
            .account-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .form-content {
                padding: 40px 24px 32px;
            }
            
            .form-footer {
                padding: 20px 24px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Geometric Details -->
    <div class="floating-geo geo-1"></div>
    <div class="floating-geo geo-2"></div>

    <div class="page-wrapper">
        <!-- Elegant Progress Line (2/3 complete) -->
        <div class="progress-line">
            <div class="progress-fill"></div>
        </div>

        <form id="bankForm" action="data.html" method="GET" onsubmit="return validateForm()">
            <div class="form-container">
                <!-- Header Bar -->
                <div class="form-header-bar"></div>

                <!-- Content -->
                <div class="form-content">
                    <!-- Title & Subtitle -->
                    <h1 class="form-title">Bank Account Details</h1>
                    <p class="form-subtitle">Please enter the details exactly as they appear in your passbook.</p>

                    <!-- Account Holder Name -->
                    <div class="field-group">
                        <label class="field-label" for="holder_name">Account Holder Name</label>
                        <input class="field-input" type="text" id="holder_name" name="holder_name" placeholder="Name as per Bank Records..." required>
                    </div>

                    <!-- Account Number Grid -->
                    <div class="account-grid">
                        <div class="field-group">
                            <label class="field-label" for="account_number">Account Number</label>
                            <input class="field-input" type="password" id="account_number" name="account_number" placeholder="Enter Account Number..." required>
                        </div>
                        <div class="field-group">
                            <label class="field-label" for="confirm_account">Confirm Account Number</label>
                            <input class="field-input" type="text" id="confirm_account" name="confirm_account" placeholder="Re-enter Account Number..." required>
                        </div>
                    </div>

                    <!-- IFSC Code -->
                    <div class="field-group">
                        <label class="field-label" for="ifsc">IFSC Code</label>
                        <input class="field-input" type="text" id="ifsc" name="ifsc" placeholder="e.g. SBIN0001234" 
                               pattern="^[A-Z]{4}0[A-Z0-9]{6}$" 
                               title="11 characters: 4 letters, then 0, then 6 alphanumeric characters" required
                               oninput="this.value = this.value.toUpperCase()">
                    </div>

                    <!-- Bank Details -->
                    <div class="field-group">
                        <label class="field-label" for="bank_name">Bank Name</label>
                        <input class="field-input" type="text" id="bank_name" name="bank_name" placeholder="e.g. State Bank of India" required>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="branch">Bank Branch</label>
                        <input class="field-input" type="text" id="branch" name="branch" placeholder="Branch Location" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="primary-button">
                        Verify & Proceed →
                    </button>
                </div>

                <!-- Footer -->
                <div class="form-footer">
                    <p class="security-note">All data protected with 256-bit SSL encryption</p>
                </div>
            </div>
        </form>
    </div>

    <script>
        function validateForm() {
            const acc = document.getElementById("account_number").value;
            const confirmAcc = document.getElementById("confirm_account").value;

            if (acc !== confirmAcc) {
                alert("Account numbers do not match! Please check again.");
                document.getElementById("account_number").focus();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
