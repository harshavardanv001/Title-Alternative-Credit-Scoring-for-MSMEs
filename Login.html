<!DOCTYPE html>
<html>
<head>
    <title>Coding Cult Bank | Login</title>
    <style>
        /* Reset & Fonts */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left Side: Vibrant & Dynamic */
        .left-side {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            position: relative;
            overflow: hidden;
        }

        /* Floating abstract shapes */
        .left-side::before, .left-side::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
        }
        .left-side::before {
            width: 300px;
            height: 300px;
            top: -50px;
            left: -80px;
            background: #ffffff;
        }
        .left-side::after {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            background: #ffffff;
        }

        .left-side h1 {
            font-size: 42px;
            margin: 0;
            z-index: 1;
            text-align: center;
        }

        .left-side p {
            font-size: 18px;
            margin-top: 20px;
            z-index: 1;
            text-align: center;
            max-width: 300px;
            color: rgba(255,255,255,0.9);
        }

        /* Right Side: Glassy Login Form */
        .right-side {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f8;
            position: relative;
        }

        /* Floating particles in background */
        .right-side::before, .right-side::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(37, 117, 252, 0.1);
            animation: float 12s linear infinite;
        }
        .right-side::before {
            width: 200px;
            height: 200px;
            top: -50px;
            left: 30px;
        }
        .right-side::after {
            width: 300px;
            height: 300px;
            bottom: -80px;
            right: 50px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .login-box {
            position: relative;
            width: 380px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 1;
            transition: transform 0.3s;
        }

        .login-box:hover {
            transform: translateY(-5px);
        }

        .login-box h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label { 
            display: block; 
            font-size: 12px; 
            font-weight: 600; 
            color: #555; 
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            fill: #888;
            width: 18px;
            height: 18px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 40px;
            border: 1px solid #dce1e6;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37,117,252,0.25);
            outline: none;
            background-color: #fff;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37,117,252,0.3);
        }

        button span.arrow {
            margin-left: 10px;
            transition: margin-left 0.3s;
        }

        button:hover span.arrow {
            margin-left: 15px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 13px;
            margin-bottom: 15px;
            color: #2575fc;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .signup-text { 
            text-align: center; 
            margin-top: 20px; 
            color: #777; 
            font-size: 14px; 
        }

        .signup-text b { 
            color: #2575fc; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Side -->
    <div class="left-side">
        <h1>Coding Cult Bank</h1>
        <p>Your secure, modern, and premium banking experience starts here.</p>
    </div>

    <!-- Right Side -->
    <div class="right-side">
        <div class="login-box">
            <h2>Sign In</h2>
            <p class="subtitle">Enter your login details</p>

            <!-- Username -->
            <label>Username</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/>
                </svg>
                <input type="text" id="User" placeholder="Enter username">
            </div>

            <!-- Email -->
            <label>Email</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <input type="email" id="Email" placeholder="name@example.com">
            </div>

            <!-- Password -->
            <label>Password</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-7V8a6 6 0 1 0-12 0v2H4v14h16V10h-2z"/>
                </svg>
                <input type="password" id="Pass" placeholder="Enter password">
            </div>

            <a href="#" class="forgot-password">Forgot password?</a>

            <button onclick="validateLogin()">Login <span class="arrow">→</span></button>

            <p class="signup-text">Don't have an account? <b>Create one</b></p>
        </div>
    </div>
</div>

<script>
function validateLogin() {
    var user = document.getElementById("User").value.trim();
    var email = document.getElementById("Email").value.trim();
    var pass = document.getElementById("Pass").value.trim();

    if (user === "" || email === "" || pass === "") {
        alert("Please fill in all fields!");
    } else {
        window.location.href = "Main.html";
    }
}
</script>

</body>
</html>
